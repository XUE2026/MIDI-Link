name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build (esp-idf-ci-action - proven working)
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: esp32-midi-gateway
        command: |
          git config --global --add safe.directory '*'
          idf.py build

    - name: List build output
      run: |
        echo "=== Listing entire build dir ==="
        find esp32-midi-gateway/build -type f 2>/dev/null | head -50
        echo "=== File sizes ==="
        du -sh esp32-midi-gateway/build/ 2>/dev/null || echo "no build dir"
        ls -laR esp32-midi-gateway/build/ 2>/dev/null | grep -v "^$" | head -80

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-build-dir
        path: esp32-midi-gateway/build/
        retention-days: 30
        if-no-files-found: error

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30