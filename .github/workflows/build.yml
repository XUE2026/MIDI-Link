name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

env:
  IDF_TARGET: esp32s3

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build firmware
      run: |
        . /opt/esp/idf/export.sh

        cd esp32-midi-gateway

        # N16R8 config
        echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults

        idf.py reconfigure
        idf.py build 2>&1 | tee build.log

        echo "=== Build artifacts ==="
        ls -la build/*.bin

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: esp32-midi-gateway/build/*.bin
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: esp32-midi-gateway/build/build.log
        retention-days: 30

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30