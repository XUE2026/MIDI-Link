name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
    paths:
      - 'esp32-midi-gateway/**'
      - '.github/workflows/**'
      - 'phone-receiver/**'
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.0
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up ESP-IDF environment and build
      run: |
        . /opt/esp/idf/export.sh

        cd esp32-midi-gateway

        # Configure for ESP32-S3 N16R8
        idf.py set-target esp32s3

        # Apply N16R8 specific config
        echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults

        idf.py reconfigure

        echo "Building firmware..."
        idf.py build 2>&1 | tee build.log

        echo "Build complete."

    - name: Collect build artifacts
      run: |
        mkdir -p /tmp/artifacts
        cd esp32-midi-gateway
        cp build/esp32-midi-gateway.bin /tmp/artifacts/ 2>/dev/null || echo "No firmware bin"
        cp build/bootloader/bootloader.bin /tmp/artifacts/ 2>/dev/null || echo "No bootloader"
        cp build/partition_table/partition-table.bin /tmp/artifacts/ 2>/dev/null || echo "No partition table"
        cp build/ota_data_initial.bin /tmp/artifacts/ 2>/dev/null || echo "No ota data"
        cp build/esp32-midi-gateway.elf /tmp/artifacts/ 2>/dev/null || echo "No elf"
        cp build/build.log /tmp/artifacts/ 2>/dev/null || echo "No build log"
        cp build/flash_args /tmp/artifacts/ 2>/dev/null || echo "No flash args"
        ls -la /tmp/artifacts/

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: /tmp/artifacts/
        retention-days: 30

  phone-receiver-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Check Python syntax
      run: |
        python -m py_compile phone-receiver/midi_receiver.py
        echo "Python syntax check passed"

    - name: Upload phone receiver scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30