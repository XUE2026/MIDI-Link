name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: esp32-midi-gateway
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== Build complete ==="

    - name: Check docker and find artifacts
      run: |
        set -x
        # Check what containers exist
        echo "=== Docker containers ==="
        docker ps -a --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}"
        # Try to find the build container
        CID=$(docker ps -a -q --filter "ancestor=espressif/idf:v5.0" --last 1)
        echo "Container ID: $CID"
        if [ -n "$CID" ]; then
          echo "=== Container filesystem check ==="
          docker cp "$CID:/" /tmp/container-root 2>/dev/null || true
          # Try various paths for build files
          for path in \
            "/app/XUE2026/MIDI-Link/esp32-midi-gateway/build" \
            "/app/XUE2026/MIDI-Link/esp32-midi-gateway/build/*.bin" \
            "/workspace/esp32-midi-gateway/build" \
            "/esp32-midi-gateway/build" \
            "/build"; do
            echo "Checking: $path"
            docker cp "$CID:$path" /tmp/check-path 2>/dev/null && echo "  EXISTS" || echo "  NOT FOUND"
          done
          # Save container filesystem listing to a file
          docker export "$CID" > /tmp/container-export.tar 2>/dev/null && \
            tar tf /tmp/container-export.tar | grep -i "\.bin$" | head -20 || \
            echo "No .bin in container fs"
        fi
        echo "=== Check workspace ==="
        ls -la esp32-midi-gateway/build/ 2>/dev/null || echo "no local build dir"
        ls -la build-output/ 2>/dev/null || echo "no build-output"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: artifacts/
        retention-days: 30
        if-no-files-found: warn

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30