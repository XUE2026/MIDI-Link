name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: esp32-midi-gateway
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== Build complete ==="
          ls -la build/*.bin
          # Touch marker file so we know build completed
          touch /tmp/build_complete

    - name: Extract artifacts via docker cp
      run: |
        set -x
        # Find the container that ran the build
        CONTAINER_ID=$(docker ps -a --filter "ancestor=espressif/idf:v5.0" --format "{{.ID}}" | head -1)
        echo "Found container: $CONTAINER_ID"
        if [ -n "$CONTAINER_ID" ]; then
          mkdir -p artifacts
          # Copy files from container
          docker cp "$CONTAINER_ID:/app/XUE2026/MIDI-Link/esp32-midi-gateway/build/" artifacts/ 2>/dev/null || \
          docker cp "$CONTAINER_ID:/app/XUE2026/MIDI-Link/esp32-midi-gateway/build/" artifacts/ 2>/dev/null || \
          docker cp "$CONTAINER_ID:/workspace/esp32-midi-gateway/build/." artifacts/ 2>/dev/null || \
          echo "Trying to find the right path..."
          # Try to explore the container filesystem
          docker exec "$CONTAINER_ID" find / -name "esp32-midi-gateway.bin" 2>/dev/null | head -5 || true
          docker exec "$CONTAINER_ID" find / -name "*.bin" -path "*/build/*" 2>/dev/null | head -10 || true
          docker exec "$CONTAINER_ID" ls -la /app/ 2>/dev/null || true
        else
          echo "NO CONTAINER FOUND"
        fi
        echo "=== artifacts ==="
        find artifacts/ -type f 2>/dev/null | head -20 || echo "empty"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: artifacts/
        retention-days: 30
        if-no-files-found: warn

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30