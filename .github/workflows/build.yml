name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build firmware in Docker
      run: |
        docker run --rm \
          -e IDF_TARGET=esp32s3 \
          -v "$(pwd):/workspace" \
          -w "/workspace/esp32-midi-gateway" \
          espressif/idf:v5.0 \
          /bin/bash -c '\
            git config --global --add safe.directory "*" && \
            echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults && \
            echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults && \
            echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults && \
            idf.py reconfigure && \
            idf.py build && \
            echo "=== Build done ===" && \
            ls -la build/*.bin && \
            cp -v build/*.bin /workspace/ && \
            echo "=== Artifacts copied ===" '

    - name: Collect and upload
      run: |
        set -x
        echo "=== Checking for .bin files at workspace root ==="
        ls -la *.bin 2>/dev/null || echo "NO .bin files at root"
        echo "=== Checking build dir ==="
        ls -la esp32-midi-gateway/build/*.bin 2>/dev/null || echo "NO .bin files in build"
        echo "=== Collecting ==="
        mkdir -p artifacts
        find . -name "*.bin" -exec cp -v {} artifacts/ \; 2>/dev/null || true
        cp -v esp32-midi-gateway/build/build.log artifacts/ 2>/dev/null || true
        ls -la artifacts/

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: artifacts/
        retention-days: 30
        if-no-files-found: warn

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30