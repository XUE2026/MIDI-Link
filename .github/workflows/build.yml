name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: esp32-midi-gateway
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "--- listing build .bin files ---"
          ls -la build/*.bin
          # Fix permissions & copy to workspace root (volume mount location)
          chmod -R a+r build/
          mkdir -p /app/github/workspace/artifacts2
          cp -v build/*.bin /app/github/workspace/artifacts2/
          cp -v build/build.log /app/github/workspace/artifacts2/ 2>/dev/null || true
          ls -la /app/github/workspace/artifacts2/

    - name: Collect
      run: |
        echo "=== pwd ==="
        pwd
        echo "=== ls -la ==="
        ls -la
        echo "=== find artifacts2 ==="
        find . -name "artifacts2" -type d 2>/dev/null || echo "no artifacts2 dir"
        echo "=== checking GITHUB_WORKSPACE ==="
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        ls -la "$GITHUB_WORKSPACE" 2>/dev/null || echo "cannot access GITHUB_WORKSPACE"
        echo "=== find any .bin ==="
        find / -name "esp32-midi-gateway.bin" 2>/dev/null | head -5 || echo "not found"
        echo "=== find any artifacts dirs ==="
        find / -name "artifacts*" -type d 2>/dev/null | head -10 || echo "none"

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30