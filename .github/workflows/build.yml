name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: 'esp32-midi-gateway'
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log

    - name: Collect artifacts
      if: always()
      run: |
        mkdir -p /tmp/artifacts
        cd esp32-midi-gateway
        cp build/esp32-midi-gateway.bin /tmp/artifacts/ 2>/dev/null || echo "no bin"
        cp build/bootloader/bootloader.bin /tmp/artifacts/ 2>/dev/null || echo "no bootloader"
        cp build/partition_table/partition-table.bin /tmp/artifacts/ 2>/dev/null || echo "no ptable"
        cp build/ota_data_initial.bin /tmp/artifacts/ 2>/dev/null || echo "no ota"
        cp build/esp32-midi-gateway.elf /tmp/artifacts/ 2>/dev/null || echo "no elf"
        cp build/build.log /tmp/artifacts/ 2>/dev/null || echo "no build log"
        cp build/flash_args /tmp/artifacts/ 2>/dev/null || echo "no flash_args"
        ls -la /tmp/artifacts/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: /tmp/artifacts/
        retention-days: 30
        if-no-files-found: warn

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30