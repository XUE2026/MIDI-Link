name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: esp32-midi-gateway
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          # Copy to parent dir (workspace root via volume mount)
          mkdir -p ../artifacts
          cp build/*.bin ../artifacts/
          cp build/build.log ../artifacts/ 2>/dev/null || true
          echo "=== Artifacts copied to workspace root ==="
          ls -la ../artifacts/

    - name: Collect firmware binaries
      run: |
        echo "=== Workspace root ==="
        pwd && ls -la
        echo "=== artifacts/ directory ==="
        ls -la artifacts/ || echo "NOT FOUND at root"
        echo "=== Search all .bin ==="
        find . -name "*.bin" 2>/dev/null | head -20

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: artifacts/
        retention-days: 30
        if-no-files-found: error

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30