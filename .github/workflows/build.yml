name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: esp32-midi-gateway
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== Build complete ==="
          ls -la build/*.bin
          # Copy to the volume mount point at /app/$REPO/
          # The volume mounts ${GITHUB_WORKSPACE} to /app/XUE2026/MIDI-Link
          mkdir -p /app/XUE2026/MIDI-Link/build-output
          cp -v build/*.bin /app/XUE2026/MIDI-Link/build-output/
          cp -v build/build.log /app/XUE2026/MIDI-Link/build-output/ 2>/dev/null || true
          ls -la /app/XUE2026/MIDI-Link/build-output/

    - name: Collect and upload
      run: |
        set -x
        echo "=== GITHUB_WORKSPACE ==="
        echo "$GITHUB_WORKSPACE"
        pwd
        ls -la
        echo "=== build-output ==="
        ls -la build-output/ 2>/dev/null || echo "no build-output dir"
        echo "=== esp32-midi-gateway/build ==="
        ls -la esp32-midi-gateway/build/ 2>/dev/null | head -20 || echo "no build dir"
        echo "=== find any .bin ==="
        find . -name "*.bin" 2>/dev/null | head -20
        echo "=== find build-output ==="
        find . -name "build-output" -type d 2>/dev/null
        echo "=== Copy to artifacts ==="
        mkdir -p artifacts
        cp -v build-output/*.bin artifacts/ 2>/dev/null || cp -v esp32-midi-gateway/build/*.bin artifacts/ 2>/dev/null || echo "NO BIN FILES"
        find . -name "*.bin" -exec cp -v {} artifacts/ \;
        cp -v esp32-midi-gateway/build/build.log artifacts/ 2>/dev/null || true
        ls -la artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: artifacts/
        retention-days: 30
        if-no-files-found: warn

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30