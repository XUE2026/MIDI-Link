name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check environment and set target
      run: |
        . /opt/esp/idf/export.sh
        idf.py --version
        echo "=== Checking tools ==="
        ls /opt/esp/tools/tools/ 2>/dev/null | head -5 || echo "No tools dir"
        
        cd esp32-midi-gateway
        echo "=== Setting target to esp32s3 ==="
        idf.py set-target esp32s3 2>&1
        
    - name: Configure for N16R8
      run: |
        . /opt/esp/idf/export.sh
        cd esp32-midi-gateway
        
        echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
        echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
        
        idf.py reconfigure 2>&1

    - name: Build firmware
      run: |
        . /opt/esp/idf/export.sh
        cd esp32-midi-gateway
        
        echo "=== Starting build ==="
        idf.py build 2>&1 | tee build.log
        STATUS=$?
        echo "=== Build exit code: $STATUS ==="
        if [ $STATUS -ne 0 ]; then
            echo "=== LAST 80 LINES ==="
            tail -80 build.log
            exit $STATUS
        fi

    - name: Collect artifacts
      if: always()
      run: |
        mkdir -p /tmp/artifacts
        cd esp32-midi-gateway
        cp build/esp32-midi-gateway.bin /tmp/artifacts/ 2>/dev/null && echo "bin OK" || true
        cp build/bootloader/bootloader.bin /tmp/artifacts/ 2>/dev/null && echo "bootloader OK" || true
        cp build/partition_table/partition-table.bin /tmp/artifacts/ 2>/dev/null && echo "ptable OK" || true
        cp build/ota_data_initial.bin /tmp/artifacts/ 2>/dev/null && echo "ota OK" || true
        cp build/esp32-midi-gateway.elf /tmp/artifacts/ 2>/dev/null && echo "elf OK" || true
        cp build/build.log /tmp/artifacts/ 2>/dev/null && echo "log OK" || true
        cp build/flash_args /tmp/artifacts/ 2>/dev/null && echo "flash_args OK" || true
        ls -la /tmp/artifacts/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: /tmp/artifacts/
        retention-days: 30

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30