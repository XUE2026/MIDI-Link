name: Build ESP32-S3 MIDI Gateway

on:
  push:
    branches: [ "development", "main" ]
  pull_request:
    branches: [ "development", "main" ]
  workflow_dispatch:

jobs:
  build-esp32s3:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build firmware with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.0
        target: esp32s3
        path: 'esp32-midi-gateway'
        command: |
          git config --global --add safe.directory '*'
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SUPPORT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
          echo "CONFIG_ESP32S3_SPIRAM_SIZE_8MB=y" >> sdkconfig.defaults
          idf.py reconfigure
          idf.py build 2>&1 | tee build.log
          echo "=== Build complete ==="

    - name: Collect artifacts from build directory
      run: |
        set -x
        cd esp32-midi-gateway
        pwd
        echo "=== Full directory tree ==="
        find . -maxdepth 4 -type d 2>/dev/null | head -20
        echo "=== Build directory contents ==="
        ls -la build/ 2>&1 || echo "No build dir"
        ls -la build/*.bin 2>&1 || echo "No bin files"
        mkdir -p /tmp/artifacts
        cp -v build/esp32-midi-gateway.bin /tmp/artifacts/ 2>&1 || echo "NO BIN"
        cp -v build/bootloader/bootloader.bin /tmp/artifacts/ 2>&1 || echo "NO BOOTLOADER"
        cp -v build/partition_table/partition-table.bin /tmp/artifacts/ 2>&1 || echo "NO PTABLE"
        cp -v build/build.log /tmp/artifacts/ 2>&1 || echo "NO LOG"
        ls -la /tmp/artifacts/

    - name: Upload firmware binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-midi-gateway-firmware
        path: /tmp/artifacts/
        retention-days: 30

  phone-receiver-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check Python syntax
      run: python -m py_compile phone-receiver/midi_receiver.py
    - name: Upload scripts
      uses: actions/upload-artifact@v4
      with:
        name: phone-receiver-scripts
        path: phone-receiver/
        retention-days: 30